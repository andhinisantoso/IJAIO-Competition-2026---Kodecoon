<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lower Primary AI Practice Lab (Grades 1–3)</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/low_lab.css">
</head>
<body>

  <div class="wrap">
    <!-- Header Navigation Bar -->
    <div class="lab-nav-header">
      <button class="back-home-btn" onclick="window.location.href='index.html'">
        ← Back to Main Syllabus
      </button>
      <div class="lab-badge-tag">Lower Primary Lab (Grades 1–3)</div>
    </div>

    <!-- Top Bar -->
    <div class="topbar">
      <div class="brand">
        <div class="bot" onclick="pokeBot()" title="Click me to say hello!">🤖</div>
        <div>
          <h1>Lower Primary Lab</h1>
          <p>Grades 1–3 · Five AI Pillars · 15 Interactive Quests</p>
        </div>
      </div>
      <div class="score-pill">⭐ <span id="scoreCount">0</span>/15 Solved</div>
    </div>

    <!-- HOME VIEW (Grid of 5 Pillars) -->
    <div id="homeView">
      <div class="path-line"></div>
      <div class="pillar-grid" id="pillarGrid"></div>
    </div>

    <!-- PILLAR VIEW (Tabs + Active Interactive Challenge) -->
    <div id="pillarView">
      <button class="back-btn" onclick="goHome()">← Back to All Pillars</button>
      <div class="pillar-head">
        <div class="num" id="pvNum">1</div>
        <div>
          <h2 id="pvTitle">Pillar Title</h2>
          <p id="pvTag">Pillar Subtitle</p>
        </div>
      </div>
      <div class="level-tabs" id="levelTabs"></div>
      <div class="exercise-card" id="exerciseCard"></div>
    </div>
  </div>

  <!-- External JS -->
  <script src="js/low_lab.js"></script>
</body>
</html>
